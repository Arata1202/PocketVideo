name: MP4AirPlayPlayer
options:
  bundleIdPrefix: com.arata1202
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
targets:
  MP4AirPlayPlayer:
    type: application
    platform: iOS
    sources:
      - MP4AirPlayPlayer
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.arata1202.PocketVideo
    info:
      path: MP4AirPlayPlayer/Info.plist
      properties:
        CFBundleName: Pocket Video
        CFBundleDisplayName: Pocket Video
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.mpeg-4
              - com.apple.quicktime-movie
              - com.apple.m4v-video
              - public.3gpp
              - public.3gpp2
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  MP4AirPlayPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MP4AirPlayPlayerTests
    dependencies:
      - target: MP4AirPlayPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arata1202.PocketVideoTests
