name: 改善提案
description: 困っていることや改善案を共有する
body:
  - type: textarea
    id: problem
    attributes:
      label: 困っていること
      description: どのような場面で不便を感じていますか？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 改善案（任意）
      description: どのようになると便利ですか？
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案・補足（任意）
      description: 現在の回避方法や、ほかに考えた方法があれば書いてください。
