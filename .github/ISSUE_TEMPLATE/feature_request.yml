name: Feature request
description: Share a problem or an idea for improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: In what situation do you encounter this problem?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution (optional)
      description: What would make this more convenient?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context (optional)
      description: Describe any current workarounds or other approaches you have considered.
