name: Bug report
description: Report something that is not working as expected
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Describe the steps that lead to the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your device model, iOS version, and Pocket Video version.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
