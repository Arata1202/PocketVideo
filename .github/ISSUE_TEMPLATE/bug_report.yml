name: 不具合報告
description: 正しく動作しない箇所を報告する
body:
  - type: textarea
    id: description
    attributes:
      label: 問題の説明
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: 問題が起きるまでの操作を書いてください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 利用環境
      description: 端末名、iOSのバージョン、Pocket Videoのバージョンを書いてください。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 補足（任意）
      description: スクリーンショットなど。個人の動画や個人情報の添付は不要です。
