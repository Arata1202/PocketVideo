name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: |
          destinations=$(xcodebuild -project PocketVideo.xcodeproj -scheme PocketVideo -showdestinations)
          simulator_id=$(awk -F 'id:' '/Ineligible destinations/ { exit }
            /platform:iOS Simulator,/ && /name:iPhone/ {
              split($2, fields, ",")
              if (!first) first = fields[1]
              if (/OS:18.5,/ && /name:iPhone 16 Pro *}/) preferred = fields[1]
            }
            END { print preferred ? preferred : first }' <<< "$destinations")
          if [[ -z "$simulator_id" ]]; then
            echo "No eligible iPhone simulator found" >&2
            exit 1
          fi
          xcodebuild test \
            -project PocketVideo.xcodeproj \
            -scheme PocketVideo \
            -destination "id=$simulator_id" \
            CODE_SIGNING_ALLOWED=NO
