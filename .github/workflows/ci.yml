name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      XCODEGEN_VERSION: 2.48.0
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Restore XcodeGen
        id: xcodegen
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/xcodegen
          key: xcodegen-${{ runner.os }}-${{ runner.arch }}-${{ env.XCODEGEN_VERSION }}
      - name: Install XcodeGen
        if: steps.xcodegen.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip" -o xcodegen.zip
          echo "620c9f0dc10849f94728ab5df52d225ebab8187439dd6fee1925e59e80dff892  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip
      - name: Generate project
        run: '"$RUNNER_TEMP/xcodegen/bin/xcodegen" generate'
      - name: Build and test
        run: |
          set -o pipefail
          candidates=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          candidates = []
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if ".iOS-" not in runtime:
                  continue
              version = tuple(map(int, runtime.split(".iOS-")[1].split("-")[:2]))
              for device in devices:
                  if version >= (17,) and device["deviceTypeIdentifier"].split(".")[-1].startswith("iPhone-"):
                      preferred = version == (18, 5) and device["name"] == "iPhone 16 Pro"
                      candidates.append((preferred, device["state"] == "Booted", version, device["udid"]))
          if not candidates:
              sys.exit("No available iPhone simulator running iOS 17 or later")
          for candidate in sorted(candidates, reverse=True):
              print(candidate[-1])
          ')
          scheme=(-project PocketVideo.xcodeproj -scheme PocketVideo)
          simulator_id=""
          for id in $candidates; do
            if xcodebuild "${scheme[@]}" -destination "id=$id" -destination-timeout 5 -showBuildSettings >/dev/null; then
              simulator_id=$id
              break
            fi
          done
          if [[ -z "$simulator_id" ]]; then
            echo "PocketVideo has no eligible iPhone simulator" >&2
            exit 1
          fi
          xcodebuild test "${scheme[@]}" -destination "id=$simulator_id" \
            CODE_SIGNING_ALLOWED=NO
