name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      XCODEGEN_VERSION: 2.48.0
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Restore XcodeGen
        id: xcodegen
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/xcodegen
          key: xcodegen-${{ runner.os }}-${{ runner.arch }}-${{ env.XCODEGEN_VERSION }}
      - name: Install XcodeGen
        if: steps.xcodegen.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip" -o xcodegen.zip
          echo "620c9f0dc10849f94728ab5df52d225ebab8187439dd6fee1925e59e80dff892  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip
      - name: Generate project
        run: '"$RUNNER_TEMP/xcodegen/bin/xcodegen" generate'
      - name: Build and test
        run: |
          destinations=$(xcodebuild -project PocketVideo.xcodeproj -scheme PocketVideo -showdestinations)
          simulator_id=$(awk -F 'id:' '/Ineligible destinations/ { exit }
            /platform:iOS Simulator,/ && /name:iPhone/ {
              split($2, fields, ",")
              if (!first) first = fields[1]
              if (/OS:18.5,/ && /name:iPhone 16 Pro *}/) preferred = fields[1]
            }
            END { print preferred ? preferred : first }' <<< "$destinations")
          if [[ -z "$simulator_id" ]]; then
            echo "No eligible iPhone simulator found" >&2
            exit 1
          fi
          xcodebuild test \
            -project PocketVideo.xcodeproj \
            -scheme PocketVideo \
            -destination "id=$simulator_id" \
            CODE_SIGNING_ALLOWED=NO
